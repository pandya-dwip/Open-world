<!doctype html><html><body style="margin:0;background:#9fc3dc"><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js'
import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js'
const q = new URLSearchParams(location.search)
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true })
renderer.setSize(innerWidth, innerHeight); renderer.toneMapping = THREE.NeutralToneMapping
const scene = new THREE.Scene(); scene.background = new THREE.Color('#9fc3dc')
scene.add(new THREE.HemisphereLight('#dfefff', '#665544', 1.3))
const sun = new THREE.DirectionalLight('#fff3dd', 2.6); sun.position.set(3, 5, 4); scene.add(sun)
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1e4, 1e4), new THREE.MeshStandardMaterial({ color: '#c9b07a' })); ground.rotation.x = -Math.PI / 2; scene.add(ground)
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder)
loader.load(q.get('f'), (g) => {
  const protos = [...g.scene.children]
  const filter = q.get('only') ? new RegExp(q.get('only')) : null
  const list = protos.filter((p) => !filter || filter.test(p.name))
  const cols = Math.ceil(Math.sqrt(list.length)); const gap = +(q.get('gap') || 4)
  const info = []
  list.forEach((p, i) => {
    const box = new THREE.Box3().setFromObject(p); const s = box.getSize(new THREE.Vector3())
    let tris = 0; p.traverse((o) => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3 })
    info.push(`${i}:${p.name} ${s.x.toFixed(1)}x${s.y.toFixed(1)}x${s.z.toFixed(1)} tris ${tris}`)
    p.position.x += (i % cols) * gap; p.position.z += Math.floor(i / cols) * gap
    scene.add(p)
  })
  const box = new THREE.Box3(); list.forEach((p) => box.expandByObject(p)); const c = box.getCenter(new THREE.Vector3()); const r = box.getSize(new THREE.Vector3()).length()
  const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 1e5)
  cam.position.set(c.x + r * 0.15, c.y + r * 0.55, c.z + r * 0.85); cam.lookAt(c)
  renderer.render(scene, cam)
  window.__info = info; document.title = 'done'
}, undefined, (e) => { document.title = 'error ' + e })
</script></body></html>
